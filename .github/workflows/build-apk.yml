name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore OCR language files only
        run: |
          ZIP=$(find . -maxdepth 2 \( -name 'ReceiptExpenseScanner_v2.2_updated.zip' -o -name 'ReceiptExpenseScanner_Android_Project_v2.2.zip' \) | head -n 1)
          if [ -n "$ZIP" ]; then
            rm -rf /tmp/receipt-old
            mkdir -p /tmp/receipt-old
            unzip -q "$ZIP" -d /tmp/receipt-old
            ASSET=$(find /tmp/receipt-old -path '*/app/src/main/assets/tessdata' -type d | head -n 1)
            if [ -n "$ASSET" ]; then
              mkdir -p app/src/main/assets/tessdata
              cp -a "$ASSET"/. app/src/main/assets/tessdata/
            fi
          fi
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/ru/chekskan/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Build APK
        run: ./gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kontrol-rashodov-APK
          path: app/build/outputs/apk/debug/app-debug.apk
